<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一致性出图画布</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">一致性出图画布</div>
  <div class="tools" id="selTools" hidden>
    <span id="selCount"></span>
    <button data-act="view">放大 / 并排对比</button>
    <button data-act="cmpRef">对比参考图</button>
    <button data-act="asRef">设为参考图</button>
    <button data-act="reuse">复用参数</button>
    <button data-act="toCard">存入资产卡</button>
    <button data-act="download">下载</button>
    <button data-act="del" class="danger">删除</button>
  </div>
  <div class="spacer"></div>
  <button id="btnNote" title="在画布上加一条文字备注">＋备注</button>
  <button id="btnUpload" title="把本地图片放到画布上">＋图片</button>
  <div class="zoom">
    <button id="zoomOut">－</button><span id="zoomPct">100%</span><button id="zoomIn">＋</button>
    <button id="zoomFit">适应</button>
  </div>
  <button id="btnBackup">备份</button>
  <button id="btnSettings" class="primary">API 设置</button>
</header>

<main>
  <aside id="library">
    <section>
      <h3>产品卡 <button class="mini" data-new="product">＋新建</button></h3>
      <div class="cards" id="cards-product"></div>
    </section>
    <section>
      <h3>人物卡 <button class="mini" data-new="person">＋新建</button></h3>
      <div class="cards" id="cards-person"></div>
    </section>
    <p class="hint">点击卡片＝出图时引用它；点 ✎ 编辑。</p>
  </aside>

  <div id="viewport">
    <div id="world"></div>
    <div id="marquee" hidden></div>
    <div id="empty">
      <h2>从这里开始</h2>
      <p>① 右上角填好 <b>API 设置</b>　② 左侧新建 <b>产品卡 / 人物卡</b>　③ 右侧选场景，点 <b>生成</b></p>
      <p class="dim">拖动空白处平移 · 双指或 ⌘/Ctrl＋滚轮缩放 · Shift＋拖动框选 · 可把图片直接拖进来</p>
    </div>
  </div>

  <aside id="panel">
    <h3>出图</h3>
    <label>场景</label>
    <div class="chips" id="scenes"></div>

    <label>引用的资产卡</label>
    <div id="refCards" class="reflist"></div>

    <label>额外参考图 <span class="dim">（在画布选中图片后点“设为参考图”）</span></label>
    <div id="extraRefs" class="thumbs"></div>

    <label id="promptLabel">画面描述</label>
    <textarea id="prompt" rows="5"></textarea>

    <div class="row">
      <div><label>尺寸</label>
        <select id="size">
          <option value="1024x1536">竖图 2:3</option>
          <option value="1024x1024">方图 1:1</option>
          <option value="1536x1024">横图 3:2</option>
          <option value="auto">自动</option>
        </select></div>
      <div><label>质量</label>
        <select id="quality">
          <option value="auto">自动</option><option value="high">高</option>
          <option value="medium">中</option><option value="low">低（省钱）</option>
        </select></div>
      <div><label id="countLabel">张数</label>
        <select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>

    <button id="btnGen" class="primary big">生成</button>
    <div id="genMsg" class="dim"></div>
    <details><summary>查看最终发送的提示词</summary><pre id="promptPreview"></pre></details>
  </aside>
</main>

<div id="modal" hidden><div id="modalBox"></div></div>
<div id="lightbox" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="backupPick" accept="application/json" hidden>
<script src="app.js"></script>
</body>
</html>
